<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <!-- No `maximum-scale` / `user-scalable=no`. Every type token in tokens.css
         is in px, so with zoom locked there was no way at all to enlarge text —
         a WCAG 1.4.4 failure. iOS has ignored `user-scalable=no` since iOS 10,
         but Android Chrome and an installed Android PWA honour it, and that is
         a target platform. The double-tap-zoom delay such a lock usually guards
         against is already handled by `touch-action: manipulation` on buttons
         (global.css). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Dark = app base colour. Also the opaque status-bar background in an
         installed iOS PWA now that black-translucent is gone (see below).

         NOT a `media="(prefers-color-scheme: …)"` pair, for two reasons. The
         app's theme is a STORED preference, not the OS one, so a media tag
         would show the wrong band to anyone whose choice disagrees with their
         phone — which is the bug this is here to fix, reintroduced through the
         fallback. And because the UA uses the first tag whose media matches, a
         pair would always match and silently swallow the runtime update
         App.tsx makes on every theme flip.

         One tag, rewritten by the script below before first paint and by
         App.tsx thereafter. The two hexes are the only copies not read from
         --theme-color-meta in tokens.css — no stylesheet exists yet this early
         in the parse. Keep all three in step. -->
    <meta name="theme-color" id="theme-color" content="#010102" />
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('pe-store') || '{}')
        var t = s.state && s.state.theme
        if (t === 'system') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        if (t === 'light') {
          document.documentElement.setAttribute('data-theme', 'light')
        }
        // Same reason the line above exists. Without it the band is dark for
        // the ~100ms until React's theme effect runs — and iOS ANIMATES a
        // theme-color change, so that shows up as a visible dark flash at the
        // top of a light-theme launch rather than as nothing at all.
        document.getElementById('theme-color').content =
          t === 'light' ? '#f4f5f9' : '#010102'
      } catch(e) {}
    </script>
    <meta name="description" content="Progress — nauka angielskiego offline" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- NOT black-translucent: on Dynamic Island iPhones that legacy mode left
         the standalone viewport ~59px short of the physical bottom (content
         drew under the status bar but height stayed screen − statusbar), so a
         black band sat below everything fixed. `default` gives a normal
         full-height viewport; viewport-fit=cover still lets content into the
         home-indicator area. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- The label under the icon on an iOS home screen. "PE" was left over from
         the old identity, so an installed app showed one brand on its icon and
         another on every screen inside. -->
    <meta name="apple-mobile-web-app-title" content="Progress" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- The mark as SVG first; favicon-32 is the fallback for browsers without
         SVG favicon support. Both now come from scripts/generate-brand.mjs,
         so the tab, the install icon and the logo in the app are one drawing. -->
    <link rel="icon" type="image/svg+xml" href="/icons/progress-mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <title>Progress</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
