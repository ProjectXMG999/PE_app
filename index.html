<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <!-- No `maximum-scale` / `user-scalable=no`. Every type token in tokens.css
         is in px, so with zoom locked there was no way at all to enlarge text —
         a WCAG 1.4.4 failure. iOS has ignored `user-scalable=no` since iOS 10,
         but Android Chrome and an installed Android PWA honour it, and that is
         a target platform. The double-tap-zoom delay such a lock usually guards
         against is already handled by `touch-action: manipulation` on buttons
         (global.css). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Dark = app base colour. Also the opaque status-bar background in an
         installed iOS PWA now that black-translucent is gone (see below).

         NOT a `media="(prefers-color-scheme: …)"` pair, for two reasons. The
         app's theme is a STORED preference, not the OS one, so a media tag
         would show the wrong band to anyone whose choice disagrees with their
         phone — which is the bug this is here to fix, reintroduced through the
         fallback. And because the UA uses the first tag whose media matches, a
         pair would always match and silently swallow the runtime update
         App.tsx makes on every theme flip.

         One tag, rewritten by the script below before first paint and by
         App.tsx thereafter. The two hexes are the only copies not read from
         --theme-color-meta in tokens.css — no stylesheet exists yet this early
         in the parse. Keep all four in step: this tag, the script below, the
         launch curtain's own hexes (scripts/generate-brand.mjs) and
         --theme-color-meta. -->
    <meta name="theme-color" id="theme-color" content="#010102" />
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('pe-store') || '{}')
        var t = s.state && s.state.theme
        if (t === 'system') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        if (t === 'light') {
          document.documentElement.setAttribute('data-theme', 'light')
        }
        // Same reason the line above exists. Without it the band is dark for
        // the ~100ms until React's theme effect runs — and iOS ANIMATES a
        // theme-color change, so that shows up as a visible dark flash at the
        // top of a light-theme launch rather than as nothing at all.
        document.getElementById('theme-color').content =
          t === 'light' ? '#f4f5f9' : '#010102'
      } catch(e) {}

      // The launch curtain runs once per browsing session, decided here so the
      // decision is made before first paint and nothing ever flashes. A reload
      // keeps sessionStorage and so skips it; a new tab plays it.
      //
      // The session is marked SHOWN when the curtain lifts, not when it starts.
      // main.tsx reloads the page the first time a service worker takes control,
      // which on a first-ever visit lands in the middle of this animation —
      // marking it up front meant that visit saw a third of a curtain and then
      // never saw the rest of it. Marked at the lift, that reload replays it.
      try {
        if (sessionStorage.getItem('pe:splash') === '1') {
          document.documentElement.setAttribute('data-splash', 'off')
        } else {
          document.documentElement.setAttribute('data-splash', 'on')
          // While this is 'on', animations.css holds the page's own .pe-arrive
          // cascade at its first frame, so the content arrives INTO the lift
          // instead of playing out unseen behind an opaque curtain.
          //
          // Released on a timer started here rather than by the bundle: if the
          // module never loads, a paused cascade would strand every page 12px
          // off its mark. src/boot/splash.ts releases it earlier on a tap; both
          // are idempotent.
          // Matches the curtain's own lift delay in scripts/generate-brand.mjs.
          setTimeout(function () {
            document.documentElement.removeAttribute('data-splash')
            try { sessionStorage.setItem('pe:splash', '1') } catch(e) {}
          }, 1340)
        }
      } catch(e) {
        document.documentElement.setAttribute('data-splash', 'off')
      }
    </script>
    <meta name="description" content="Progress — nauka angielskiego offline" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- NOT black-translucent: on Dynamic Island iPhones that legacy mode left
         the standalone viewport ~59px short of the physical bottom (content
         drew under the status bar but height stayed screen − statusbar), so a
         black band sat below everything fixed. `default` gives a normal
         full-height viewport; viewport-fit=cover still lets content into the
         home-indicator area. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- The label under the icon on an iOS home screen. "PE" was left over from
         the old identity, so an installed app showed one brand on its icon and
         another on every screen inside. -->
    <meta name="apple-mobile-web-app-title" content="Progress" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- The mark as SVG first; favicon-32 is the fallback for browsers without
         SVG favicon support. Both now come from scripts/generate-brand.mjs,
         so the tab, the install icon and the logo in the app are one drawing. -->
    <link rel="icon" type="image/svg+xml" href="/icons/progress-mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <title>Progress</title>
  </head>
  <body>
    <!-- PE:SPLASH:START (generated by scripts/generate-brand.mjs — do not edit by hand) -->
    <style>
/* The mark draws itself with stroke-dashoffset, which is a paint-level
   animation rather than a compositor one — the app's usual transform-only rule
   cannot express a line being drawn. It is two short paths on an otherwise
   empty screen, and it is the only one here that is not transform/opacity. */
#pe-splash{position:fixed;inset:0;z-index:9000;display:grid;place-items:center;
background:#010102;animation:pe-splash-out 280ms cubic-bezier(0.16,1,0.3,1) 1340ms forwards}
#pe-splash::before{content:'';position:absolute;inset:0;
background:radial-gradient(120% 70% at 50% 42%,rgba(168,141,255,.22),transparent 70%);
animation:pe-splash-bloom 900ms cubic-bezier(0.16,1,0.3,1) both}
.pe-splash__lock{position:relative;display:flex;flex-direction:column;align-items:center;
animation:pe-splash-lift 280ms cubic-bezier(0.16,1,0.3,1) 1340ms forwards}
.pe-splash__mark{height:92px;width:54.05px;
animation:pe-splash-fade 140ms linear 60ms both}
.pe-splash__stem,.pe-splash__bowl{stroke-dasharray:1}
.pe-splash__stem{animation:pe-splash-up 400ms cubic-bezier(0.55,0.1,0.3,1) 60ms both}
.pe-splash__bowl{animation:pe-splash-draw 460ms cubic-bezier(0.55,0.1,0.3,1) 360ms both}
.pe-splash__word{height:38.859px;width:161.758px;margin-top:27.6px;
color:#f5f5f8;fill:currentColor;animation:pe-splash-rise 500ms cubic-bezier(0.16,1,0.3,1) 760ms both}
.pe-splash__by{margin-top:14.72px;font:700 11px/1 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
letter-spacing:.14em;text-transform:uppercase;color:#94949f;
animation:pe-splash-rise-sm 400ms cubic-bezier(0.16,1,0.3,1) 1030ms both}
@keyframes pe-splash-bloom{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes pe-splash-fade{from{opacity:0}to{opacity:1}}
@keyframes pe-splash-up{from{stroke-dashoffset:-1}to{stroke-dashoffset:0}}
@keyframes pe-splash-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pe-splash-rise{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
@keyframes pe-splash-rise-sm{from{opacity:0;transform:translate3d(0,6px,0)}to{opacity:1;transform:none}}
@keyframes pe-splash-lift{to{transform:translate3d(0,-10px,0)}}
/* Ends inert, so a bundle that never arrives cannot leave the curtain down. */
@keyframes pe-splash-out{to{opacity:0;visibility:hidden;pointer-events:none}}
/* Tap-to-skip runs DIFFERENTLY-NAMED copies rather than retiming the two above.
   Re-timing them looked instant: an animation still inside its 1340ms delay has
   already elapsed more than a 220ms duration, so shortening it in place jumps
   straight to the end frame and fires animationend the same tick. A new name is
   a new animation, and it starts from zero. */
@keyframes pe-splash-out-fast{to{opacity:0;visibility:hidden;pointer-events:none}}
@keyframes pe-splash-lift-fast{to{transform:translate3d(0,-10px,0)}}
#pe-splash.pe-splash--skip{animation:pe-splash-out-fast 220ms cubic-bezier(0.16,1,0.3,1) both}
.pe-splash--skip .pe-splash__lock{animation:pe-splash-lift-fast 220ms cubic-bezier(0.16,1,0.3,1) both}
[data-splash='off'] #pe-splash{display:none}
[data-theme='light'] #pe-splash{background:#f4f5f9}
[data-theme='light'] #pe-splash::before{background:radial-gradient(120% 70% at 50% 42%,rgba(124,58,237,.13),transparent 70%)}
[data-theme='light'] .pe-splash__word{color:#2b2c37}
[data-theme='light'] .pe-splash__by{color:#7d7e89}
/* Governs only the window before the bundle loads; animations.css then caps
   every duration at 0.01ms !important, which finishes the curtain outright.
   Reduced motion therefore means a still lockup and no launch animation. */
@media (prefers-reduced-motion:reduce){
#pe-splash{animation:pe-splash-out 200ms linear 340ms forwards}
#pe-splash::before,.pe-splash__mark,.pe-splash__word,.pe-splash__by{animation:pe-splash-fade 160ms linear both}
.pe-splash__lock{animation:none}
.pe-splash__stem,.pe-splash__bowl{stroke-dasharray:none;animation:none}}
    </style>
