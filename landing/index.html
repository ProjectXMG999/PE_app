<style>
  :root{
    --bg: #0D0B1E;
    --surface: #1A1040;
    --ink: #FFFFFF;
    --ink-soft: rgba(255,255,255,.65);
    --line: rgba(255,255,255,.10);
    --brand: #6B2BFF;
    --accent: #8B5CF6;
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--ink);
    font-family:'Roboto', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.font-head{
    font-family:'Montserrat', system-ui, sans-serif;
  }

  .nav{
    position:sticky;top:0;z-index:50;
    background:color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .nav__inner{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 28px;max-width:1180px;margin:0 auto;
  }
  .brand{display:flex;align-items:center;gap:10px;font-family:'Montserrat',sans-serif;font-weight:800;font-size:17px;letter-spacing:-.01em}
  .brand img{width:30px;height:30px;border-radius:8px}

  .canvas{
    max-width:1180px;margin:0 auto;
    padding:120px 28px;
    display:flex;align-items:center;justify-content:center;
    min-height:60vh;
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
  }
</style>
